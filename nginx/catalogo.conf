server {
    listen 80;
    server_name catalogo.tudominio.com;
    root /var/www/catalogo/public;
    index index.php;

    # Bloquear acceso a archivos sensibles
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # HTTPS (descomentar tras certbot)
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/catalogo.tudominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/catalogo.tudominio.com/privkey.pem;
}